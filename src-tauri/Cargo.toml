[package]
name = "petari"
version = "0.1.0"
description = "Lightweight Markdown stickies for your desktop"
authors = ["subir-sh"]
edition = "2021"

[lib]
name = "petari_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
